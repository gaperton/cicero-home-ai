version = 1

; Global settings shared across all models.
; Each running instance is pinned to a single GPU via `--device` on the CLI
; (see run.sh), so these presets target one card at a time — no split-mode.
[*]
parallel = 1
flash-attn = true
jinja = true
fit = true
fit-target = 256
cache-ram = -1
cache-type-k = q8_0
cache-type-v = q8_0

; --- Gemma 4 31B (single GPU; Q8_0 weights + MTP draft leave little VRAM
; headroom for context on a 32GB card — verify fit, drop to a smaller quant
; if it won't boot with usable context) ---
[gemma4-31b]
n-gpu-layers = 99
model = models/Gemma4-31B/gemma-4-31B-it-Q6_K.gguf
model-draft = models/Gemma4-31B/MTP/mtp-gemma-4-31B-it-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3.6 27B Q8_0 MTP (single GPU) ---
[qwen3.6-27b]
n-gpu-layers = 99
model = models/Qwen3.6-27B/Qwen3.6-27B-UD-Q6_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

