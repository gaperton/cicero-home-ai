version = 1

; Router preset for instance 1 (Vulkan1, port 8081).
; The device and port are assigned by run.sh, so presets target one card at a
; time and must not use split-mode.
[*]
parallel = 2
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 256
cache-ram = -1
cache-type-k = q8_0
cache-type-v = q8_0

; --- Gemma 4 26B-A4B MoE, Q6 XL ---
; MTP is intentionally disabled: every tested draft depth was slower than the
; baseline on this Vulkan/R9700 host.
[gemma4-26b-a4b]
n-gpu-layers = 99
model = models/Gemma4-26B-A4B/gemma-4-26B-A4B-it-UD-Q6_K_XL.gguf
parallel = 4
ctx-size = 524288
; Low stochasticity improves strict Gemma tool-call formatting.
temp = 0.2
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3.6 35B-A3B MoE, Q5 XL ---
[qwen3.6-35b-a3b]
n-gpu-layers = 99
model = models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking endpoint for Hindsight, to
; replace the CPU BAAI/bge-reranker-v2-m3 path that dominates Recall latency ---
[qwen3-reranker-0.6b]
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
parallel = 8
ctx-size = 8192
batch-size = 8192
ubatch-size = 8192
