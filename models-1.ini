version = 1

; Router preset for instance 1 (Vulkan1, port 8081).
; The device and port are assigned by run.sh, so presets target one card at a
; time and must not use split-mode.
[*]
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 256
cache-ram = -1
cache-type-k = q8_0
cache-type-v = q8_0

; --- GPT-OSS 20B UD-Q8_K_XL — PRIMARY Hindsight model (Hindsight's own official
; local recommendation). Replaced Gemma, whose peg-gemma4 tool-call path hits the
; unfixed llama.cpp #21375 runaway-generation loop. Output is bounded natively via
; reasoning_effort=low (sent by Hindsight in LLM_EXTRA_BODY) rather than by a token
; cap. Note: enable_thinking is a Gemma/Qwen flag and is a no-op here.
; Sampling params omitted on purpose: Hindsight sends its own per-op temperatures.
; ctx-size 300000 / parallel 3 = 100000 per slot; gpt-oss trains at 131072.
; batch/ubatch are raised above llama.cpp's 2048/512 defaults because Hindsight is
; prefill-dominated: measured Retain/Consolidation calls evaluate 22000-24000
; prompt tokens and generate only 25-250, so ~90% of each call is prompt
; processing at ~2500 tok/s. ---
[gpt-oss-20b]
load-on-startup = true
n-gpu-layers = 99
model = models/GPT-OSS-20B/gpt-oss-20b-UD-Q8_K_XL.gguf
parallel = 3
ctx-size = 300000
repeat-penalty = 1.0
batch-size = 4096
ubatch-size = 2048

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking endpoint for Hindsight, to
; replace the CPU BAAI/bge-reranker-v2-m3 path that dominates Recall latency.
; ctx-size is a TOTAL, so it must be read per slot: 32768 / 8 = 4096 per pair.
; The earlier 8192 gave only 1024/slot, and llama.cpp rejects the WHOLE rerank
; request (HTTP 400 exceed_context_size_error) if any single query+document pair
; exceeds it — one long memory unit would break reranking for that Recall.
; ubatch-size must stay >= per-slot ctx: reranking is non-causal, so a pair has
; to fit in one physical batch. ---
[qwen3-reranker-0.6b]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
parallel = 8
ctx-size = 32768
batch-size = 8192
ubatch-size = 8192
