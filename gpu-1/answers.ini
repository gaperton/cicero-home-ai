version = 1

; Benchmark router preset for Vulkan1:8081 — ANSWER phase.
; Device and port are assigned by run.sh, so this targets one card and must not
; use split-mode.
;
; Section names are the model ids the router exposes over the API. The profile
; presets (oss/gemma/qwen.ini) serve [llm]; this one serves [answer], a distinct
; id so HINDSIGHT_API_ANSWER_LLM_MODEL never collides with the model under test
; and locomo_fast's judge-independence check stays meaningful.
; --models-max is 2, so exactly these two stay resident.
;
; Nothing answers to `llm` while this preset is loaded, deliberately: a Hindsight
; call that reaches the LLM during the answer phase — the Reflect answer
; generator, not the default --context-format structured path — then fails loudly
; with an unknown-model error instead of being silently served by the answer model.
;
; This is the LoCoMo harness's fixed ANSWER model — the benchmark standing in for
; an agent that consumes Hindsight's memories. It is NOT the model under test:
; retain and consolidation already ran under oss/gemma/qwen.ini. Holding the
; answer model constant across those legs is what keeps their scores comparable.
;
; Phase order, one ./switch per phase:
;   ./switch gpu-1 oss|gemma|qwen   ingest + consolidate (model under test)
;   ./switch gpu-1 answers          this file — recall + answer generation
;   ./switch gpu-1 judge            scoring
; The answer phase still calls Recall, which is why [reranker] is here. The judge
; phase does not — judge_answer() takes plain strings, no memory engine.
;
; Fit: 21.28 GiB weights + 0.60 GiB reranker on a 31.86 GiB card. Identical
; footprint to qwen.ini, whose 200k KV budget is already proven on this pair.
[*]
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 512
cache-ram = -1
; q8_0 KV, as in qwen.ini: this model has no caveat against quantized KV and the
; halved footprint is what buys a 200k context alongside the reranker on one card.
cache-type-k = q8_0
cache-type-v = q8_0

; --- Qwen3.6 35B-A3B, UD-Q4_K_XL (MoE, 35B total, ~3B active per token) ---
;
; Independent of the judge (gemma4-31b in judge.ini), so answers are not
; self-graded. Same file as qwen.ini's [llm] — on that one leg the answer model
; and the model under test share a family, a milder confound than swapping the
; judge and the price of holding the judge constant. See .env.bench-qwen.
[answer]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; Built-in multi-token prediction — no separate draft file needed. Verified
; present in this checkpoint (nextn/mtp tensors in the GGUF); measured 1.42x
; decode on the Q5_K_XL sibling (108.6 -> ~154 tok/s).
spec-type = draft-mtp
spec-draft-n-max = 2
; `reasoning` is deliberately left at llama.cpp's 'auto' default, unlike the
; Hindsight profiles which force it off: the harness hardcodes
; reasoning_effort="high" for the answer role (locomo_benchmark.py), and Qwen
; honours the standard reasoning_effort field. It dominates per-call cost.
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
; Backstop against a pathological generation holding a slot past the client
; timeout. Real maxima are far below it. If this fires, something regressed.
n-predict = 4096
; Raised above llama.cpp's 2048/512 defaults for this prefill-heavy workload.
batch-size = 4096
ubatch-size = 2048
; 200000 / 2 slots = 100000 per slot. Answer prompts run ~44k with
; --context-format structured (~101k without), so a slot holds one comfortably.
; Keep `parallel` in step with locomo_fast --max-concurrent-questions, which
; applies to BOTH the answer and judge phases — judge.ini uses 2 for that reason.
parallel = 2
ctx-size = 200000

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking for Hindsight Recall ---
; Keeps the [reranker] id, unlike the LLM section above: Recall really does run
; during the answer phase, so HINDSIGHT_API_RERANKER_LITELLM_MODEL must keep
; resolving. Identical to the other :8081 profiles; see oss.ini for the reasoning
; behind kv-unified, cache-ram=0 and parallel=8.
[reranker]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
cache-ram = 0
kv-unified = true
parallel = 8
ctx-size = 32768
batch-size = 4096
ubatch-size = 4096
