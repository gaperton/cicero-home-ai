version = 1

; Benchmark router preset for Vulkan1:8081 — JUDGE phase.
; Device and port are assigned by run.sh, so this targets one card and must not
; use split-mode.
;
; Section names are the model ids the router exposes over the API. The profile
; presets (oss/gemma/qwen.ini) serve [llm]; this one serves [judge], a distinct
; id — which is what keeps locomo_fast's _check_judge_independence honest, since
; it decides self-judging by comparing HINDSIGHT_API_JUDGE_LLM_MODEL against
; HINDSIGHT_API_LLM_MODEL. --models-max is 2, so exactly these two stay resident.
;
; Nothing answers to `llm` while this preset is loaded. Scoring never calls
; Hindsight, so that is correct rather than merely tolerable.
;
; This is the LoCoMo harness's fixed JUDGE model, held constant across the
; oss/gemma/qwen legs — that is what makes their scores comparable to each other.
; It is the only candidate that shares a family with neither the answer model
; (qwen3.6-35b in answers.ini) nor, on two of three legs, the model under test.
;
; Phase order, one ./switch per phase:
;   ./switch gpu-1 oss|gemma|qwen   ingest + consolidate (model under test)
;   ./switch gpu-1 answers          recall + answer generation
;   ./switch gpu-1 judge            this file — scoring
; Scoring touches no Hindsight machinery: judge_answer() in
; benchmarks/common/benchmark_runner.py takes plain strings, and the runner
; generates every answer for a conversation before judging any of them. The
; [reranker] here is convention only, so the env stays identical across presets.
;
; Fit: 16.10 GiB weights + 0.60 GiB reranker on a 31.86 GiB card — the roomiest
; preset on this GPU, which is why f16 KV is affordable below.
[*]
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 512
cache-ram = -1
; f16 KV, as in gemma.ini: quantized KV measures ~29% slower prefill on this
; workload, and here there is VRAM to spare for it.
cache-type-k = f16
cache-type-v = f16

; --- Gemma 4 31B QAT, UD-Q4_K_XL (dense) ---
;
; MTP draft deliberately absent: it gains 1.3x at one slot but loses 2.6x at two
; (batched draft verification collapses decode to 7.7 tok/s), and this preset
; runs parallel=2.
[judge]
load-on-startup = true
n-gpu-layers = 99
model = models/Gemma4-31B-QAT/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
; `reasoning` is left at llama.cpp's 'auto' default on purpose: the evaluator
; hardcodes reasoning_effort="high", so judge calls are token-heavy even on the
; ~480-token prompts they send.
;
; Bounds the thought block and forces its closing tag — the same guard gemma.ini
; needs, and it pairs with patches/gemma4-required-toolcall/llama-cpp.patch. The
; judge asks for a strict schema, i.e. a forced tool turn, which is exactly the
; path where an unbounded gemma4 grammar makes EOS unreachable and a repetition
; collapse holds a slot past the client timeout. 1024 leaves ample headroom: at
; the judge's temperature=0 a trivial case needs ~252 thinking tokens.
reasoning-budget = 1024
; Backstop against a pathological generation holding a slot past the client
; timeout. If this fires, something regressed.
n-predict = 4096
; Server-side defaults only — the evaluator sends its own temperature=0.
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
; 65536 / 2 slots = 32768 per slot. Judge prompts are small (~480 tokens) and
; generation is bounded by n-predict, so this is generous.
; Keep `parallel` in step with locomo_fast --max-concurrent-questions, which
; applies to BOTH the answer and judge phases — answers.ini uses 2 to match.
parallel = 2
ctx-size = 65536

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking for Hindsight Recall ---
; Unused during scoring — judging is a pure replay over stored answers. Kept so
; the reranker stays reachable if a phase overlaps, and it costs 0.60 GiB on the
; roomiest preset here. See oss.ini for the reasoning behind kv-unified,
; cache-ram=0 and parallel=8.
[reranker]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
cache-ram = 0
kv-unified = true
parallel = 8
ctx-size = 32768
batch-size = 4096
ubatch-size = 4096
