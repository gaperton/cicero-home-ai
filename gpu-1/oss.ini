version = 1

; Hindsight router preset for Vulkan1:8081 — gpt-oss profile (default).
; Device and port are assigned by run.sh, so this targets one card and must not
; use split-mode. Pairs with ~/.config/hindsight/hindsight-gpt-oss.env; select both:
;   ./switch-hindsight-model.sh oss
;
; Section names are the model ids the router exposes over the API. Both profiles
; use [llm] and [reranker] so the Hindsight env never changes between them.
; --models-max is 2, so exactly these two stay resident.
;
; The faster of the two working profiles (Reflect 22-30s vs Gemma's 68-83s) and
; Hindsight's own recommended local model. The Gemma profile also works; see
; notes/hindsight-gemma.md.
[*]
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 512
cache-ram = -1
; f16 KV, not q8_0: llama.cpp's gpt-oss guide advises against quantized KV for
; this model, and it measures ~29% slower prefill here (3073 vs 3962 tok/s on a
; 22k-token prompt). Costs VRAM but fits: 19.05 of 31.86 GiB with both resident.
cache-type-k = f16
cache-type-v = f16

; --- GPT-OSS 20B, UD-Q8_K_XL ---
;
; Output is bounded natively by reasoning_effort=low, which Hindsight sends in
; HINDSIGHT_API_LLM_EXTRA_BODY — that env var and this preset are a pair.
[llm]
load-on-startup = true
n-gpu-layers = 99
model = models/GPT-OSS-20B/gpt-oss-20b-UD-Q8_K_XL.gguf
; 0.2 is the only working control for Reflect and Consolidation: of Hindsight's
; three configured temperatures only Retain actually sends one (0.1), so the other
; two inherit whatever is set here. Not 0.0 — greedy decoding is the classic
; repetition-loop trigger on this model. top-p/top-k/min-p left at llama.cpp
; defaults; gpt-oss's official 1.0/1.0/0 measured no better.
temp = 0.2
repeat-penalty = 1.0
; Backstop against a pathological generation holding a slot past the client
; timeout. Real maxima are far below it. If this fires, something regressed.
n-predict = 4096
; Raised above llama.cpp's 2048/512 defaults for this prefill-heavy workload.
batch-size = 4096
ubatch-size = 2048
; 393216 / 3 slots = 131072 per slot — gpt-oss's native training context.
; Raised from 300000 (100000/slot) on 2026-08-19: Hindsight Recall built
; 101456-token prompts on fact-dense banks and llama.cpp rejected them with
; exceed_context_size_error, failing the whole request.
; kv-unified deliberately NOT set, unlike the reranker: measured worse here
; (3-concurrent wall 19.88s vs 21.18s).
parallel = 3
ctx-size = 393216
; The model's own harmony template plus one added line forcing tool calls onto the
; commentary channel. Without it gpt-oss emits a malformed hybrid channel header on
; Reflect's later turns and llama.cpp returns HTTP 500. Re-extract from the GGUF
; and re-apply after any model update.
chat-template-file = templates/gpt-oss-20b-harmony.jinja

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking for Hindsight Recall ---
;
; kv-unified shares one KV buffer instead of slicing ctx-size per slot: -29% on a
; 100-document rerank, and n_ctx_slot becomes the full 32768 rather than
; ctx-size/parallel. The ceiling on one query+document pair is then ubatch-size,
; and an overflow fails the WHOLE request — keep
; HINDSIGHT_API_RERANKER_LITELLM_MAX_TOKENS_PER_DOC below it.
;
; parallel is a throughput ANTI-lever here. llama.cpp posts one task per document
; and fans them across free slots, but the card is already saturated by that
; fan-out, so extra slots only add per-sequence overhead: on 100 documents at
; ~200 tok, 1 slot sustains 0.15 rerank/s against 0.08 at 8. This file still says
; 8 for historical continuity; gpu-0-1/combined.ini uses 1 and carries the data.
[reranker]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
; No slot prompt cache: every rerank document is a distinct sequence, so the cache
; never hits and only churns.
cache-ram = 0
kv-unified = true
parallel = 8
ctx-size = 32768
batch-size = 4096
ubatch-size = 4096
