version = 1

; Hindsight router preset for Vulkan1:8081 — Gemma profile.
; Device and port are assigned by run.sh, so this targets one card and must not
; use split-mode. Pairs with ~/.config/hindsight/hindsight-gemma.env; select both:
;   ./switch-hindsight-model.sh gemma
;
; Section names are the model ids the router exposes over the API. Both profiles
; use [llm] and [reranker] so the Hindsight env never changes between them.
; --models-max is 2, so exactly these two stay resident.
;
; Slower than the gpt-oss profile (Reflect 68-83s vs 22-30s) but functionally
; equivalent. Setup and troubleshooting: notes/hindsight-gemma.md
[*]
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 512
cache-ram = -1
; f16 KV, not q8_0: quantized KV measures ~29% slower prefill on this workload.
cache-type-k = f16
cache-type-v = f16

; --- Gemma 4 26B-A4B MoE QAT, UD-Q4_K_XL ---
;
; reasoning-budget below is REQUIRED, as is
; patches/gemma4-required-toolcall/llama-cpp.patch. Without both, Reflect hangs: on
; a forced tool turn the gemma4 grammar has unbounded rules with EOS unreachable,
; so a repetition collapse never ends and holds a router slot past the client
; timeout. See notes/hindsight-gemma.md.
[llm]
load-on-startup = true
n-gpu-layers = 99
model = models/Gemma4-26B-A4B-QAT/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
; Bounds the thought block and forces its closing tag. 1024 is the measured value;
; genuine thinking here runs ~600-1100 tokens. Raising it re-opens the hang window
; — re-run benchmark/gemma-fix-validation.py before changing it.
reasoning-budget = 1024
; Backstop only. Real maxima are far below it (reflect 1749, retain 652 tokens).
; If this ever fires, something regressed.
n-predict = 4096
; llama.cpp's --reasoning defaults to 'auto', which turns thinking ON even though
; the template defaults it off. Without this Gemma reasons on every call.
reasoning = off
; 0.2, not Gemma's official 1.0: Reflect and Consolidation send no sampling params
; and inherit this; 0.2 is better for structured output. Retain sends its own 0.1.
temp = 0.2
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
; 300000 / 3 slots = 100000 per slot.
parallel = 3
ctx-size = 300000
; MTP draft deliberately absent: loading it fails with "Gemma4Assistant requires
; ctx_other to be set" and llama.cpp runs without a draft anyway.

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking for Hindsight Recall ---
;
; kv-unified shares one KV buffer instead of slicing ctx-size per slot: -29% on a
; 100-document rerank, and n_ctx_slot becomes the full 32768 rather than
; ctx-size/parallel. The ceiling on one query+document pair is then ubatch-size,
; and an overflow fails the WHOLE request — keep
; HINDSIGHT_API_RERANKER_LITELLM_MAX_TOKENS_PER_DOC below it.
;
; parallel is not a throughput lever: Hindsight sends all candidates in one request
; and llama.cpp processes them serially. 8 slots only serve concurrent Recalls.
[reranker]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
; No slot prompt cache: every rerank document is a distinct sequence, so the cache
; never hits and only churns.
cache-ram = 0
kv-unified = true
parallel = 8
ctx-size = 32768
batch-size = 4096
ubatch-size = 4096
