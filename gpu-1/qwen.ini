version = 1

; Hindsight router preset for Vulkan1:8081 — Qwen3.6 35B-A3B profile.
; Device and port are assigned by run.sh, so this targets one card and must not
; use split-mode. Pairs with ~/.config/hindsight/hindsight-qwen.env; select both:
;   ./switch-hindsight-model.sh qwen
;
; Section names are the model ids the router exposes over the API. All profiles
; use [llm] and [reranker] so the Hindsight env never changes between them.
; --models-max is 2, so exactly these two stay resident.
;
; Why this profile: 35B total but MoE with ~3B active per token, so it decodes at
; dense-20B speed while carrying a much larger parameter count. Q4_K_XL (21.3 GiB)
; rather than the Q5_K_XL used on :8080, because here it shares the card with the
; reranker and needs room for a 300k KV budget.
;
; NOTE: the benchmark harness also uses qwen3.6-35b on :8080 (Q5_K_XL) as its fixed
; answer+judge model, and .env.bench-qwen keeps it that way on purpose: a constant
; judge across the oss/gemma/qwen legs is what makes their scores comparable. The
; cost is that this leg's memory model shares a family with its answer model, which
; may parse its own extraction style more readily. Milder than swapping the judge,
; but a reason to weigh this leg's margin cautiously.
[*]
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 512
cache-ram = -1
; q8_0 KV here, unlike the gpt-oss profile: that model's guide advises against
; quantized KV, but Qwen has no such caveat and the halved KV footprint is what
; buys the 300k context alongside the reranker on one card. Revert to f16 if
; quality regresses on long contexts.
cache-type-k = q8_0
cache-type-v = q8_0

; --- Qwen3.6 35B-A3B, UD-Q4_K_XL (MoE, ~3B active) ---
[llm]
load-on-startup = true
n-gpu-layers = 99
reasoning = off
model = models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; Built-in multi-token prediction — no separate draft file needed. Verified
; present in this checkpoint (nextn/mtp tensors in the GGUF); measured 1.42x
; decode on the Q5_K_XL sibling (108.6 -> ~154 tok/s). Same knobs as the
; qwen3.6-27b preset on :8080.
spec-type = draft-mtp
spec-draft-n-max = 2
; Of Hindsight's three configured temperatures only Retain actually sends one
; (0.1); Reflect and Consolidation inherit whatever is set here. Not 0.0 —
; greedy decoding is the classic repetition-loop trigger.
temp = 0.2
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
; Backstop against a pathological generation holding a slot past the client
; timeout. Real maxima are far below it. If this fires, something regressed.
n-predict = 4096
; Raised above llama.cpp's 2048/512 defaults for this prefill-heavy workload.
batch-size = 4096
ubatch-size = 2048
; 200000 / 2 slots = 100000 per slot, matching HINDSIGHT_API_LLM_MAX_CONCURRENT=2.
parallel = 2
ctx-size = 200000

; --- Qwen3 Reranker 0.6B, Q8_0 — GPU reranking for Hindsight Recall ---
; Identical to the other :8081 profiles; see models-1-oss.ini for the reasoning
; behind kv-unified, cache-ram=0 and parallel=8.
[reranker]
load-on-startup = true
n-gpu-layers = 99
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
cache-ram = 0
kv-unified = true
parallel = 8
ctx-size = 32768
batch-size = 4096
ubatch-size = 4096
