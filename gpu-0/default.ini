version = 1

; Router preset for instance 0 (Vulkan0, port 8080).
; The device and port are assigned by run.sh, so presets target one card at a
; time and must not use split-mode.
[*]
parallel = 1
flash-attn = true
jinja = true
fit = true
fit-target = 512
cache-ram = -1
cache-type-k = q8_0
cache-type-v = q8_0

; --- Gemma 4 31B (single GPU; Q8_0 weights + MTP draft leave little VRAM
; headroom for context on a 32GB card — verify fit, drop to a smaller quant
; if it won't boot with usable context) ---
[gemma4-31b]
n-gpu-layers = 99
model = models/Gemma4-31B/gemma-4-31B-it-Q6_K.gguf
model-draft = models/Gemma4-31B/MTP/mtp-gemma-4-31B-it-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3.6 27B Q8_0 MTP (single GPU) ---
[qwen3.6-27b]
n-gpu-layers = 99
model = models/Qwen3.6-27B/Qwen3.6-27B-UD-Q6_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3.6 35B-A3B (MoE: 35B total, ~3B active per token, so it decodes far
; faster than the dense 27B/31B above at similar VRAM). Used as the benchmark's
; fixed ANSWER model: independent of both the judge (gemma4-31b) and the models
; under test on :8081, so a run varies only Hindsight's memory model.
; Q4_K_XL = 25.3GB weights on a 34.2GB card, no draft model, leaving ~9GB for KV.
; MTP verified present in this checkpoint (nextn/mtp tensors in the GGUF), so it
; uses built-in multi-token prediction like the 27B preset -- no separate draft
; model file is needed. ---
[batch-qwen3.6-35b]
; Two slots: this model serves BOTH the benchmark's answer and judge phases, and
; the harness drives them concurrently. The [*] default of 1 forced every request
; to queue, and Hindsight bills queue wait to the call, so latencies read inflated.
; Keep this in step with the benchmark's concurrency (locomo_fast --max-concurrent-questions).
parallel = 2
cont-batching = true
n-gpu-layers = 99
model = models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; Independent judge — only candidate not sharing a family with the answer model.
; MTP left off: it gains 1.3x at 1 slot but loses 2.6x at 2 (batched draft
; verification collapses decode to 7.7 tok/s).
[batch-gemma4-31b]
parallel = 2
cont-batching = true
n-gpu-layers = 99
model = models/Gemma4-31B-QAT/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
;model-draft = models/Gemma4-31B-QAT/MTP/mtp-gemma-4-31B-it-Q8_0.gguf
;spec-type = draft-mtp
;spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
