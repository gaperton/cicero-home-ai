version = 1

; Benchmark judges for Vulkan1:8081.  ./switch-hindsight-model.sh judge
; No [llm]/[reranker] here — Hindsight is offline until you switch back to qwen.
; The -1 suffix is --models-max: one model at a time, loaded on demand.

[*]
parallel = 2
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 256
cache-ram = -1
cache-type-k = q8_0
cache-type-v = q8_0

; Independent judge — only candidate not sharing a family with the answer model.
; MTP left off: it gains 1.3x at 1 slot but loses 2.6x at 2 (batched draft
; verification collapses decode to 7.7 tok/s).
[gemma4-31b]
n-gpu-layers = 99
model = models/Gemma4-31B-QAT/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
;model-draft = models/Gemma4-31B-QAT/MTP/mtp-gemma-4-31B-it-Q8_0.gguf
;spec-type = draft-mtp
;spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; Strength probe. Same family as the answer model, so it does not fix the bias.
[qwen3.6-27b]
n-gpu-layers = 99
model = models/Qwen3.6-27B/Qwen3.6-27B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; Incumbent judge — keep as the control arm in every sweep.
[qwen3.6-35b]
n-gpu-layers = 99
model = models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
