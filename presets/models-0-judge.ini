version = 1

; Router preset for judge sweeps on instance 0 (Vulkan0, port 8080).
;
; Purpose: benchmark_runner's LLM-as-judge, driven offline by
; hindsight-dev/benchmarks/common/rejudge.py, which replays stored answers
; through one judge after another. Use it in place of models-0.ini for a sweep:
;
;   MODELS_0_PRESET=./models-0-judge.ini ./run.sh
;
; Why this file exists rather than reusing models-0.ini: that preset gives
; `parallel = 2` to [qwen3.6-35b] alone, because it is the benchmark's ANSWER
; model and the harness drives answers concurrently. The other two inherit the
; [*] default of 1. That is invisible in normal use and brutal in a judge sweep:
; measured on a 100-answer replay, qwen3.6-35b ran 4.1 s/verdict while
; gemma4-31b ran 18.7 s/verdict -- 4.5x slower while emitting 5-10x FEWER tokens
; (~180 vs ~1200 per verdict), because it was queueing against a single slot.
; Here every judge gets 2 slots, so the arms are comparable to each other and a
; full sweep finishes in a sitting.
;
; --models-max stays at the SERVER_FLAGS default of 1: only one judge is resident
; at a time. That is deliberate and costs nothing here. A judge sweep runs one
; model to completion before moving on, so it pays exactly one eviction per judge
; -- and the models cannot co-reside anyway (35B at Q5 is 25.3GB, 27B at Q6 is
; ~22GB, on a 34.2GB card).
;
; Sampling is copied verbatim from models-0.ini on purpose. The judge client
; sends temperature=0 per call, so these mostly do not bite, but keeping them
; identical means verdicts from this preset stay comparable with the runs already
; recorded under models-0.ini.
;
; Note on the sampling block in each section: at temperature 0 llama.cpp collapses
; to argmax, and top-p/top-k/min-p only ever prune the tail, which can never
; remove the argmax. They are INERT here -- kept as documentation of what the
; model would use if something called it warm. The only sampling knobs that can
; change a verdict are the penalties, which run before temperature in the chain;
; both are left disabled deliberately, since a judge's core act is quoting the
; answer back and a repetition penalty taxes exactly that.

[*]
; 3 slots for EVERY judge -- the whole point of this file. Keep in step with
; rejudge.py --concurrency; raising one without the other just re-queues.
parallel = 2
cont-batching = true
flash-attn = true
jinja = true
no-mmap = true
fit = true
fit-target = 256
cache-ram = -1
; q8_0, measured rather than assumed. f16 was tried first on the theory that an
; exact cache would steady a decision that is only ~98% reproducible; an A/B over
; the same 100 answers refuted both halves of that:
;   speed    482s (f16) vs 459s (q8_0); per-call decode 52.0 vs 51.5 tok/s, i.e.
;            identical. KV bandwidth scales with context, and this workload sits
;            at ~1-2k tokens, where the cache is a rounding error against the
;            weight traffic. KV quantisation matters at long context; not here.
;   verdicts 84/100 both ways, 2 questions differing -- exactly the run-to-run
;            floor the same model shows against itself. No quality signal.
; So q8_0 is chosen for MEMORY, not speed: it halves KV, which is irrelevant for
; the 35B (82 KiB/token) and decisive for gemma4-31b (1920 KiB/token, 23x more),
; the model this file exists to give slots to.
cache-type-k = q8_0
cache-type-v = q8_0

; --- Gemma 4 31B — the independent judge ---
; The judge models-0.ini names as intended ("independent of both the judge
; (gemma4-31b) and the models under test on :8081"). It is the only candidate
; here from a different family than the answer model, so it is the only one that
; removes self-preference bias rather than merely relocating it.
; Q5_K_XL weights + an MTP draft model are the tightest fit in this file; with
; parallel = 2 the KV allocation doubles, so verify it boots with usable context
; and drop to a smaller quant if it does not.
[gemma4-31b]
n-gpu-layers = 99
model = models/Gemma4-31B-QAT/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
;model-draft = models/Gemma4-31B-QAT/MTP/mtp-gemma-4-31B-it-Q8_0.gguf
;spec-type = draft-mtp
;spec-draft-n-max = 2
;fit-target = 2048
;cache-type-k = f16
;cache-type-v = f16
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3.6 27B — the strength probe ---
; Dense 27B at Q5_K_XL against the answer model's 35B-A3B at Q5 with ~3B active
; per token, so per-token it is plausibly the stronger grader. It does NOT fix
; the bias: same family and lineage as both the answer model and the qwen leg's
; memory model. Treat its result as "is a stronger judge worth it", not "is the
; judge independent".
[qwen3.6-27b]
n-gpu-layers = 99
model = models/Qwen3.6-27B/Qwen3.6-27B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- Qwen3.6 35B-A3B — the incumbent, kept as the control arm ---
; This is what .env.bench-* actually set as the judge, so it must stay in the
; sweep: replaying a judge against its own stored verdicts is the only way to
; separate "these two judges disagree" from "judging is noisy". Measured floor on
; the 200 cached verdicts: 2 flips per 100 at temperature 0, kappa ~0.91, and
; both legs' accuracies reproduced exactly. No other arm can beat that ceiling.
; MoE with ~3B active, so it is also by far the fastest judge here.
[qwen3.6-35b]
n-gpu-layers = 99
model = models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
