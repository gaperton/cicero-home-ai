version = 1

; Combined two-GPU router. Measurements: notes/gpu-0-1-tuning.md.
; Do not pass a global --device from run.sh: it overrides per-model placement.
; fit must remain off because automatic fitting does not support tensor split.
[*]
device = ROCm0,ROCm1
fit = off
n-gpu-layers = 99
cont-batching = true
flash-attn = true
jinja = true
cache-ram = -1

; --- Qwen3.8 27B UD-Q5_K_M, built-in MTP — the chat model ---
; Tensor split improves decode by 39%. Context is 196608 per slot, below the
; model's 262144-token training limit. Verified under full concurrent load (both
; slots here, all three on [llm], plus two 100-document reranks): 631/532 MiB free
; on ROCm0/ROCm1, no failures and no material GTT use. The earlier 1.11/1.57 GiB
; figure predates the qwen3-reranker-logits patch and the [llm] rebalance.
[qwen3.8-27b]
split-mode = tensor
load-on-startup = true
model = models/Qwen3.8-27B/Qwen3.8-27B-UD-Q5_K_M.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
parallel = 2
ctx-size = 393216
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- GPT-OSS 20B UD-Q8_K_XL — Hindsight's LLM ---
; The harmony template is required for Reflect tool calls. Total context is three
; 131072-token slots (was two). The third slot is for Retain, which the
; llm_requests table shows running at 2.45 average concurrency against only two
; slots. KV is 9216 MiB, up 3072 from the two-slot layout: only 12 of 24 layers
; are full attention at 24 KiB/token, and the sliding-window half stays at
; ~162 MiB regardless of context. HINDSIGHT_API_LLM_MAX_CONCURRENT must track
; `parallel` here — see ~/.config/hindsight/hindsight-gpt-oss.env.
;
; This is maxed out. Idle free VRAM is 990/856 MiB and the measured peak under
; full concurrent load (all three slots here, both on [qwen3.8-27b], plus two
; 100-document reranks) is 631/532 MiB, with no GTT spill and no failures. KV is
; preallocated at startup, so long prompts do not raise that peak — a single
; 53690-token request left it unchanged. There is no room for another slot, more
; context, or a larger reranker ubatch without taking some back.
;
; Tensor 48/52 is the balancing knob for the whole stack: it offsets the
; ROCm0-only reranker. Retuned twice — from 38/62 after the qwen3-reranker-logits
; patch cut the reranker's ROCm0 compute buffer 2418 -> 240 MiB, then to 48/52
; when the third slot's KV re-tilted the balance. Re-measure it whenever the
; reranker or either model's context changes.
; ubatch 2048 is the Retain/Consolidate concurrency-2 optimum (25.90 s score).
[llm]
split-mode = tensor
tensor-split = 48,52
load-on-startup = true
model = models/GPT-OSS-20B/gpt-oss-20b-UD-Q8_K_XL.gguf
chat-template-file = hindsight/templates/gpt-oss-20b-harmony.jinja
no-mmap = true
parallel = 3
ctx-size = 393216
cache-type-k = f16
cache-type-v = f16
batch-size = 4096
ubatch-size = 2048
temp = 0.2
repeat-penalty = 1.0
n-predict = 4096

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; Keep this unsplit on ROCm0: tensor mode crashes on the first rerank request.
; One slot has the best throughput. ubatch 4096 must fit each truncated document
; plus its query; one oversized pair rejects the entire rerank request.
[reranker]
device = ROCm0
split-mode = none
load-on-startup = true
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
no-mmap = true
cache-ram = 0
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
