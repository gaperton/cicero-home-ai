version = 1

; Combined two-GPU router. Measurements: notes/gpu-0-1-tuning.md.
; Do not pass a global --device from run.sh: it overrides per-model placement.
; fit must remain off because automatic fitting does not support tensor split.
[*]
device = ROCm0,ROCm1
fit = off
n-gpu-layers = 99
cont-batching = true
flash-attn = true
jinja = true
cache-ram = -1

; --- Qwen3.8 27B UD-Q5_K_M, built-in MTP — the chat model ---
; Tensor split improves decode by 39%. Context is 196608 per slot, below the
; model's 262144-token training limit. Verified under full concurrent load (both
; slots here, all three on [llm], plus two 100-document reranks): 1190/1235 MiB
; free on ROCm0/ROCm1, no failures and no material GTT use. The earlier 1.11/1.57
; GiB figure predates the qwen3-reranker-logits patch and the [llm] rebalance.
[qwen3.8-27b]
split-mode = tensor
load-on-startup = true
model = models/Qwen3.8-27B/Qwen3.8-27B-UD-Q5_K_M.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
parallel = 2
ctx-size = 393216
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- GPT-OSS 20B UD-Q8_K_XL — Hindsight's LLM ---
; The harmony template is required for Reflect tool calls. Total context is split
; into three 114688-token slots (was two of 131072). The third slot is for Retain,
; which the llm_requests table shows running at 2.45 average concurrency against
; only two slots; 114688 still clears Reflect's 38k observed max by ~3x. It costs
; 1920 MiB of KV (6144 -> 8064 MiB; only 12 of 24 layers are full attention, the
; sliding-window half stays at ~162 MiB regardless of context).
;
; Tensor 48/52 is the balancing knob for the whole stack: it offsets the
; ROCm0-only reranker. It has been retuned twice — from 38/62 after the
; qwen3-reranker-logits patch cut the reranker's ROCm0 compute buffer
; 2418 -> 240 MiB, then to 48/52 when the third slot's KV re-tilted the balance.
; Idle free VRAM is now 1558/1569 MiB, i.e. even to within 11 MiB.
; Re-measure this split whenever the reranker or either model's context changes.
; ubatch 2048 is the Retain/Consolidate concurrency-2 optimum (25.90 s score).
[llm]
split-mode = tensor
tensor-split = 48,52
load-on-startup = true
model = models/GPT-OSS-20B/gpt-oss-20b-UD-Q8_K_XL.gguf
chat-template-file = hindsight/templates/gpt-oss-20b-harmony.jinja
no-mmap = true
parallel = 3
ctx-size = 344064
cache-type-k = f16
cache-type-v = f16
batch-size = 4096
ubatch-size = 2048
temp = 0.2
repeat-penalty = 1.0
n-predict = 4096

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; Keep this unsplit on ROCm0: tensor mode crashes on the first rerank request.
; One slot has the best throughput. ubatch 4096 must fit each truncated document
; plus its query; one oversized pair rejects the entire rerank request.
[reranker]
device = ROCm0
split-mode = none
load-on-startup = true
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
no-mmap = true
cache-ram = 0
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
