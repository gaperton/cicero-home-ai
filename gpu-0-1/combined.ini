version = 1

; Combined two-GPU router. Measurements: notes/gpu-0-1-tuning.md.
; Do not pass a global --device from run.sh: it overrides per-model placement.
; fit must remain off because automatic fitting does not support tensor split.
[*]
device = ROCm0,ROCm1
fit = off
n-gpu-layers = 99
cont-batching = true
flash-attn = true
jinja = true
cache-ram = -1

; --- Qwen3.8 27B UD-Q5_K_M, built-in MTP — the chat model ---
; Tensor split improves decode by 39%. Context is 196608 per slot, below the
; model's 262144-token training limit. Verified with both slots active: 1.11/1.57
; GiB free on ROCm0/ROCm1 and no material GTT use.
[qwen3.8-27b]
split-mode = tensor
load-on-startup = true
model = models/Qwen3.8-27B/Qwen3.8-27B-UD-Q5_K_M.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
parallel = 2
ctx-size = 393216
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- GPT-OSS 20B UD-Q8_K_XL — Hindsight's LLM ---
; The harmony template is required for Reflect tool calls. Total context is split
; into two 131072-token slots. Tensor 38/62 offsets the ROCm0-only reranker;
; ubatch 2048 is the Retain/Consolidate concurrency-2 optimum (25.90 s score).
[llm]
split-mode = tensor
tensor-split = 38,62
load-on-startup = true
model = models/GPT-OSS-20B/gpt-oss-20b-UD-Q8_K_XL.gguf
chat-template-file = templates/gpt-oss-20b-harmony.jinja
no-mmap = true
parallel = 2
ctx-size = 262144
cache-type-k = f16
cache-type-v = f16
batch-size = 4096
ubatch-size = 2048
temp = 0.2
repeat-penalty = 1.0
n-predict = 4096

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; Keep this unsplit on ROCm0: tensor mode crashes on the first rerank request.
; One slot has the best throughput. ubatch 4096 must fit each truncated document
; plus its query; one oversized pair rejects the entire rerank request.
[reranker]
device = ROCm0
split-mode = none
load-on-startup = true
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
no-mmap = true
cache-ram = 0
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
