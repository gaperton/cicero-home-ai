version = 1

; Combined router — one llama-server, both cards, all three models resident.
; Measurements behind every number here: notes/gpu-0-1-tuning.md
;
; run.sh passes no --device: the router merges its CLI args over every section and
; that merge OVERWRITES, so a --device there would override all placement below.
; The comma matters — llama-server takes -dev a,b; llama-bench takes -dev a/b.
;
; fit = off is required, not preferred: llama_params_fit is not implemented for
; SPLIT_MODE_TENSOR (common/fit.cpp), throws, and llama.cpp then falls back to the
; full training context and OOMs. Nothing here is auto-sized.
[*]
device = ROCm0,ROCm1
fit = off
n-gpu-layers = 99
cont-batching = true
flash-attn = true
jinja = true
cache-ram = -1

; --- Qwen3.8 27B UD-Q5_K_M, built-in MTP — the chat model ---
; tensor split: +39% decode, and decode is what a chat model costs.
; 163840/slot is past n_ctx_train (131072/slot) — RoPE-extended, untested there.
[qwen3.8-27b]
split-mode = tensor
load-on-startup = true
model = models/Qwen3.8-27B/Qwen3.8-27B-UD-Q5_K_M.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
parallel = 2
ctx-size = 327680
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

; --- GPT-OSS 20B UD-Q8_K_XL — Hindsight's LLM ---
; Section name and settings from gpu-1/oss.ini so HINDSIGHT_API_LLM_MODEL=llm keeps
; resolving; see HINDSIGHT.md for temp 0.2, f16 KV, and the harmony template
; (without it Reflect's later turns return HTTP 500).
;
; layer split: +61% pp4096, and Reflect prefills 14-38k tokens.
; 131072/slot is the limit Recall hits — it has built 101456-token prompts, and an
; overflow fails with exceed_context_size_error. Watch the per-slot figure, not the total.
; tensor-split offsets the reranker on ROCm1; 63,37 is measured, not derived.
[llm]
split-mode = layer
tensor-split = 63,37
load-on-startup = true
model = models/GPT-OSS-20B/gpt-oss-20b-UD-Q8_K_XL.gguf
chat-template-file = templates/gpt-oss-20b-harmony.jinja
no-mmap = true
parallel = 2
ctx-size = 262144
cache-type-k = f16
cache-type-v = f16
batch-size = 4096
ubatch-size = 2048
temp = 0.2
repeat-penalty = 1.0
n-predict = 4096

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; NEVER split-mode = tensor: it loads, then dies on the first /v1/rerank request
; with GGML_ASSERT(offset == 0), surfacing as an HTTP 500 from a 'loaded' model.
;
; parallel = 1 is the throughput optimum: 0.15 rerank/s against 0.08 at 8 slots.
; ubatch 4096 is the per-document ceiling — a 3072-token doc plus a 500-token
; query must fit in ONE ubatch, and an overflow fails the whole request.
; ctx-size follows from parallel = 1: only one query+document pair is ever in
; flight, so the KV need only cover that pair. (kv-unified was dropped here —
; measured a no-op at one slot: same n_ctx_slot, VRAM and latency.)
[reranker]
device = ROCm1
split-mode = none
load-on-startup = true
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
no-mmap = true
cache-ram = 0
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
