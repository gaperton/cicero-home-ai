version = 1

; Qwen3.8-Flash-Next (qwen4exp), 176.94B A3B, UD-IQ4_XS. Evaluation preset, not
; deployed. Exclusive: needs ~60 GiB, so it replaces [llm]/[qwen3.8-27b]/[reranker]
; and takes Hindsight down. See patches/README.md for the required patches and
; benchmark/reports/bench-flashnext-*.md for the measurements behind these settings.
;
;   ./switch gpu-0-1 qwen3.8-flash
;   ./switch gpu-0-1 combined   # back to production

[*]
device = ROCm0,ROCm1
flash-attn = true
jinja = true

; n-gpu-layers must stay unset — fit only adjusts params still at their default,
; and an explicit value here makes it abort instead of offloading experts to CPU.
[qwen3.8-flash]
load-on-startup = true
model = models/Qwen3.8-Flash-Next/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
spec-draft-model = models/Qwen3.8-Flash-Next/MTP/mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
load-mode = mmap
fit = on
; ROCm0 below ~2560 drops into a better placement (spill 7.35L vs 9.42L here)
; but crashes under real prefill every time at n_tokens=8192 — confirmed on a
; clean GPU. 2560,4096: min free under a 92k-token prompt 1737/1019 MiB.
fit-target = 2560,4096
parallel = 1
ctx-size = 163840
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0
