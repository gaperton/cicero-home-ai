version = 1

; Qwen3-ASR-1.7B, Q8_0. Speech-to-text via /v1/audio/transcriptions (mtmd audio
; input, not chat). Small enough to sit on one card alongside everything else in
; combined.ini, but kept as its own switchable preset for now, same as
; qwen3.8-flash.ini — merge into combined.ini once validated.
;
;   ./switch gpu-0-1 qwen3-asr
;   ./switch gpu-0-1 combined   # back to production

[*]
device = ROCm0,ROCm1
fit = off
n-gpu-layers = 99
cont-batching = true
flash-attn = true
jinja = true
cache-ram = -1

[qwen3.8-27b]
split-mode = tensor
load-on-startup = true
model = models/Qwen3.8-27B/Qwen3.8-27B-UD-Q6_K.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
parallel = 3
ctx-size = 600000
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 0
repeat-penalty = 1.0

[qwen3-asr]
device = ROCm0
split-mode = none
load-on-startup = true
model = models/Qwen3-ASR-1.7B/Qwen3-ASR-1.7B-Q8_0.gguf
mmproj = models/Qwen3-ASR-1.7B/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
load-mode = none
; 4 slots so concurrent transcriptions don't serialize (observed: 3 concurrent
; requests took 1.58s total = sum of individual latencies, zero overlap, with
; parallel=1). ctx-size stays a fixed total (2048/slot at 4) — real requests
; run 23-484 tokens (see 2026-09-22 latency log analysis), so still ample.
parallel = 4
ctx-size = 8192
temp = 0
repeat-penalty = 1.0

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; Keep this unsplit on ROCm0: tensor mode crashes on the first rerank request.
; One slot has the best throughput. ubatch 4096 must fit each truncated document
; plus its query; one oversized pair rejects the entire rerank request.
[qwen3-reranker]
device = ROCm0
split-mode = none
load-on-startup = true
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
load-mode = none
cache-ram = 0
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096