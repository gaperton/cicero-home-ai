# rad/compose.yaml — the active model profile on both R9700s (TP=2) via the radiance engine
# (codeberg.org/StillDeadcode/radiance). Flags common to every profile are here; a profile's
# own come in as RADIANCE_ARGS. Context: the full trained 262144 (upstream examples: 200000).
# Started in the foreground by run.sh under cicero-rad.service; variables come from
# config.env and rad/profiles/<profile>.env (exported by run.sh). No restart policy: systemd
# supervises. No API key.

name: cicero-rad

services:
  radiance:
    image: ${RADIANCE_IMAGE}
    container_name: cicero-rad
    init: true
    network_mode: host
    # IDs come from run.sh: the host's own user and its render/video groups.
    user: "${RAD_UID}:${RAD_GID}"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    # io_uring (n-gram table reads) and ROCm's NUMA calls are refused by the default profile.
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
    volumes:
      - ${RADIANCE_MODELS}:/models:ro
      - ${RADIANCE_STATE}:/data
    stop_grace_period: 60s
    # The parser takes "--flag value", not "--flag=value". 256 MiB headroom: the engine
    # asks >= 226. Each profile keeps its prefix cache in its own directory.
    command: >
      --model /models/${RADIANCE_MODEL}
      --served-model-name ${SERVED_MODEL_NAME}
      --host ${HOST}
      --port ${PORT}
      --tp 2
      --max-num-seqs 8
      --max-model-len 262144
      --gpu-headroom-mib 256
      --kv-cache-dtype fp8
      --prefix-cache-host-mib 4096
      --prefix-cache-dir /data/kvcache/${RADIANCE_PROFILE}
      --prefix-cache-disk-mib 131072
      ${RADIANCE_ARGS}
