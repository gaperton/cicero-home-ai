version = 1

; Global settings shared across all models
[*]
n-gpu-layers = 99
split-mode = layer
parallel = 2
ctx-size = 360000
flash-attn = true
jinja = true
fit = true
fit-target = 256
cache-ram = -1
cache-type-k = f16
cache-type-v = f16

; --- Gemma 4 31B (ROCm, split across 2 GPUs) ---
[gemma4-31b@gamma]
model = models/gemma-4-31B-it-Q8_0.gguf
model-draft = models/gemma-4-31B-it-Q8_0-MTP.gguf
spec-type = draft-mtp

spec-draft-n-max = 4
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 1.5
repeat-penalty = 1.0
