version = 1

; llama.cpp sidecar of the vLLM stack: the models vLLM does not serve (ASR and
; the reranker), on :$LLAMA_PORT. run.sh loads them before vLLM, so vLLM's KV
; pool is sized around them.
;
; vLLM takes the same KV pool on both cards, so the fuller card here limits it.
; The placement keeps the cards level at ~2.5 GiB each: ROCm0 holds the ASR text
; model, ROCm1 the reranker and the ASR audio encoder. Re-size
; KV_CACHE_MEMORY_BYTES in config.env after changing anything here.
;
; Each section sets its own `device`; a --device on the router's command line
; would override them all.

[*]
fit = off
n-gpu-layers = 99
cache-ram = 0
flash-attn = true
jinja = true
split-mode = none
load-on-startup = true
load-mode = none

; --- Qwen3-ASR 1.7B Q8_0 — /v1/audio/transcriptions, via the audio proxy :8079 ---
; Requests stay under 500 tokens, so one 4096-token slot is enough.
; mmproj-device puts the audio encoder on ROCm1 to balance the cards.
[qwen3-asr]
device = ROCm0
mmproj-device = ROCm1
model = models/Qwen3-ASR-1.7B/Qwen3-ASR-1.7B-Q8_0.gguf
mmproj = models/Qwen3-ASR-1.7B/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
parallel = 1
ctx-size = 4096
temp = 0
repeat-penalty = 1.0

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; Unsplit: tensor mode crashes on the first rerank request. One slot is the
; fastest. ubatch must fit one query plus document (Hindsight truncates documents
; at 3072 tokens); a single oversized pair fails the whole rerank request.
[qwen3-reranker]
device = ROCm1
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
