version = 1

; llama.cpp sidecar for the vLLM stack: the two small models vLLM cannot serve,
; on :$LLAMA_PORT (config.env) next to vLLM's :8080. run.sh loads these first and
; starts vLLM only once both are resident, so vLLM sizes itself around them.
;
; VRAM is the coupling: vLLM claims the same KV pool on both cards, so the
; heavier card here sets KV_CACHE_MEMORY_BYTES in config.env, and the layout
; below keeps the two cards level: ROCm0 holds the ASR text model (2.43 GB),
; ROCm1 the reranker (1.67 GB) plus the ASR audio encoder (1.13 GB). Figures are
; after each model's first request, which allocates the encoder's buffers.
; Re-size the KV pool after changing anything that moves VRAM here.
;
; Placement lives here, never on the router's command line (see
; gpu-0-1/run.sh): every section carries its own `device`.

[*]
fit = off
n-gpu-layers = 99
cache-ram = 0
flash-attn = true
jinja = true
split-mode = none
load-on-startup = true
load-mode = none

; --- Qwen3-ASR 1.7B Q8_0 — /v1/audio/transcriptions, via audio/ proxy :8079 ---
; Real requests run 23-484 tokens (2026-09-22 latency log), so one 4096 slot is
; ample. 4 slots at 8192 total cost ~0.45 GiB more KV on this card.
; mmproj-device moves the audio encoder to ROCm1: -1.15 GB on ROCm0, and
; transcription latency is unchanged (0.330 vs 0.333 s for a 17 s clip).
[qwen3-asr]
device = ROCm0
mmproj-device = ROCm1
model = models/Qwen3-ASR-1.7B/Qwen3-ASR-1.7B-Q8_0.gguf
mmproj = models/Qwen3-ASR-1.7B/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
parallel = 1
ctx-size = 4096
temp = 0
repeat-penalty = 1.0

; --- Qwen3 Reranker 0.6B Q8_0 — Hindsight Recall ---
; Unsplit: tensor mode crashes on the first rerank request. One slot has the
; best throughput. ubatch 4096 must fit each truncated document plus its query
; (Hindsight truncates at 3072); one oversized pair rejects the whole request.
[qwen3-reranker]
device = ROCm1
model = models/Qwen3-Reranker-0.6B/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
parallel = 1
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
