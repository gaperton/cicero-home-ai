version = 1

; Global settings shared across all models
[*]
split-mode = layer
parallel = 1
flash-attn = true
jinja = true
fit = true
fit-target = 256
cache-ram = -1
cache-type-k = f16
cache-type-v = f16

; --- Gemma 4 31B (ROCm, split across 2 GPUs) ---
[gemma4-31b]
n-gpu-layers = 99
model = models/Gemma4-31B/gemma-4-31B-it-Q8_0.gguf
model-draft = models/Gemma4-31B/MTP/mtp-gemma-4-31B-it-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 1.5
repeat-penalty = 1.0

; --- Qwen3.6 27B Q8_0 MTP (ROCm, split across 2 GPUs) ---
[qwen3.6-27b]
n-gpu-layers = 99
model = models/Qwen3.6-27B/Qwen3.6-27B-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 1.5
repeat-penalty = 1.0